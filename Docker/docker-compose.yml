services:
# -------------- Base de datos --------------
# ________MySQL________
  mysql:
    build: ./mysql
    container_name: contenedor-smartruta-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${SHARED_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DB_NAME}
      MYSQL_USER: ${SHARED_DB_USER}
      MYSQL_PASSWORD: ${SHARED_DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-net

# ________PostgreSQL________
  postgres:
    build: ./postgres
    container_name: contenedor-smartruta-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB_NAME}
      POSTGRES_USER: ${SHARED_DB_USER}
      POSTGRES_PASSWORD: ${SHARED_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-net

# ________MariaDB________
  mariadb:
    build: ./mariadb
    container_name: contenedor-smartruta-mariadb
    ports:
      - "3307:3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${SHARED_DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DB_NAME}
      MARIADB_USER: ${SHARED_DB_USER}
      MARIADB_PASSWORD: ${SHARED_DB_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - app-net

# ______Redis________
  redis:
    build: ./redis
    container_name: contenedor-smartruta-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-net

  # ------ Init: descarga el bundle de CA de RDS (se ejecuta y termina) -----
  rds-cert:
    image: curlimages/curl:latest
    container_name: rds-cert-init
    user: root
    restart: "no"
    entrypoint: ["sh", "-c"]
    command:
      - curl -fsSL -o /certs/rds-ca.pem https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem
    volumes:
      - rds_certs:/certs
    networks:
      - app-net

# ------ DBGate (Interfaz de administración de bases de datos) -----
  dbgate:
    image: dbgate/dbgate:latest
    container_name: visor-bases-de-datos
    restart: always
    ports:
      - "8080:3000"
    volumes:
      - dbgate_data:/root/.dbgate
      - rds_certs:/certs:ro
    environment:
      CONNECTIONS: mysql,postgres,mariadb,redis,rds
      USE_SSL_rds: "1"
      SSL_CA_FILE_rds: /certs/rds-ca.pem
      SSL_REJECT_UNAUTHORIZED_rds: "1"

      # Local ----------------------------------
      LABEL_mysql: MySQL
      ENGINE_mysql: mysql@dbgate-plugin-mysql
      SERVER_mysql: mysql
      PORT_mysql: 3306
      USER_mysql: ${SHARED_DB_USER}
      PASSWORD_mysql: ${SHARED_DB_PASSWORD}

      LABEL_postgres: PostgreSQL
      ENGINE_postgres: postgres@dbgate-plugin-postgres
      SERVER_postgres: postgres
      PORT_postgres: 5432
      USER_postgres: ${SHARED_DB_USER}
      PASSWORD_postgres: ${SHARED_DB_PASSWORD}

      LABEL_mariadb: MariaDB
      ENGINE_mariadb: mysql@dbgate-plugin-mysql
      SERVER_mariadb: mariadb
      PORT_mariadb: 3306
      USER_mariadb: ${SHARED_DB_USER}
      PASSWORD_mariadb: ${SHARED_DB_PASSWORD}

      LABEL_redis: Redis
      ENGINE_redis: redis@dbgate-plugin-redis
      SERVER_redis: redis
      PORT_redis: 6379

      # AWS RDS ----------------------------------
      LABEL_rds: AWS RDS
      ENGINE_rds: mysql@dbgate-plugin-mysql   
      SERVER_rds: ${AWS_RDS_DB_ENDPOINT}
      PORT_rds: 3306                         
      USER_rds: ${SHARED_DB_USER}
      PASSWORD_rds: ${SHARED_DB_PASSWORD}
      DATABASE_rds: ${AWS_RDS_DB_NAME}

    depends_on:
      mysql:
        condition: service_started
      postgres:
        condition: service_started
      mariadb:
        condition: service_started
      redis:
        condition: service_started
      rds-cert:
        condition: service_completed_successfully
    
    networks:
      - app-net


networks:
  app-net:
    driver: bridge

volumes:
  mysql_data:
  postgres_data:
  mariadb_data:
  redis_data:
  dbgate_data:
  rds_certs: